# @package _global_
#
# Transformer encoder + CTC head — "Small" config.
# Uses standard nn.TransformerEncoder (Pre-LN, GELU, sinusoidal PE).
#
module:
  _target_: emg2qwerty.lightning.T5CTCModule
  in_features: 528          # freq(33) * channels(16)
  mlp_features: [384]       # MLP front-end → 768 features
  d_model: 128              # Small config
  num_layers: 4             # 4 layers
  num_heads: 4              # 4 heads
  d_ff: 512                 # 4× d_model
  d_kv: 32                  # unused, kept for compat
  use_cnn: true             # toggle temporal CNN featurizer
  blank_penalty_epochs: 40  # 0 = disable anti-blank penalty
  blank_alpha_max: 50.0     # peak penalty weight

datamodule:
  _target_: emg2qwerty.lightning.WindowedEMGDataModule
  window_length: 8000       # 4-sec windows
  padding: [1800, 200]      # 900ms left + 100ms right context
