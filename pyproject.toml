# EMG2QWERTY — UCLA ECE C147/C247 Final Project
#
# Project source layout:
#
#   src/
#     emg2qwerty/
#       __init__.py
#       charset.py     # Character set definition (keys ↔ labels ↔ unicode)
#       data.py        # HDF5 session loader + WindowedEMGDataset
#       decoder.py     # CTCGreedyDecoder + CTCBeamDecoder (requires kenlm)
#       lightning.py   # PyTorch Lightning DataModule + TDSConvCTCModule
#       metrics.py     # CharacterErrorRates (CER/IER/DER/SER)
#       modules.py     # TDSConvEncoder + supporting nn.Modules
#       train.py       # Hydra entry-point (train + eval)
#       transforms.py  # Signal transforms (LogSpectrogram, SpecAugment, etc.)
#       utils.py       # Shared utilities
#   tests/
#     test_charset.py
#     test_decoder.py  # Requires kenlm; mark slow / skip if unavailable
#     test_data.py     # Requires HDF5 data files
#   notebooks/         # EDA, result visualization (nbstripout will clean these)
#   config/            # Hydra/YAML experiment configs
#   scripts/           # Dataset utilities (generate_splits, print_stats, etc.)
#   docs/

[project]
name = "emg2qwerty"
version = "0.1.0"
description = "Predicting keystrokes from surface EMG signals using deep learning (ECE C147/C247)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "pytorch-lightning>=2.0",
    "torchmetrics>=1.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "h5py>=3.10",
    "pydantic>=2.6",
    "unidecode>=1.3",
    "python-Levenshtein>=0.21",
    "tqdm>=4.66",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "boto3>=1.34",
    "botocore>=1.34",
    "python-dotenv>=1.0",
    "click>=8.1",
    "pandas>=2.1",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.0",
    "pre-commit>=3.6",
    "ipywidgets>=8.1",
    "jupyterlab>=4.1",
    "nbstripout>=0.7",
    "moto[s3]>=4.2",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.7",
    "mkdocs-awesome-nav>=2.9",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.ruff]
exclude = ["notebooks/", "site/", "*.ipynb"]
line-length = 120

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"
